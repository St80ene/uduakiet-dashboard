<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Background Dark Container for better visual contrast on browser tabs -->
    <linearGradient id="udua-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Logo Primary Gradient -->
    <linearGradient id="udua-grad" x1="2" y1="2" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="udua-accent" x1="16" y1="4" x2="28" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Dark Background Badge (Ensures visibility in dark/light browser tab headers) -->
  <rect width="32" height="32" rx="8" fill="url(#udua-bg)" />

  <!-- Main 'U' + '1' Geometric Body -->
  <path
    d="M6.5 7.5C6.5 6.39543 7.39543 5.5 8.5 5.5H11.5C12.6046 5.5 13.5 6.39543 13.5 7.5V17.5C13.5 18.6046 14.3954 19.5 15.5 19.5H17.5C18.6046 19.5 19.5 18.6046 19.5 17.5V13.5C19.5 12.3954 20.3954 11.5 21.5 11.5H23.5C24.6046 11.5 25.5 12.3954 25.5 13.5V17.5C25.5 22.4706 21.4706 26.5 16.5 26.5H15.5C10.5294 26.5 6.5 22.4706 6.5 17.5V7.5Z"
    fill="url(#udua-grad)"
  />

  <!-- Upward Dynamic Arrow Accent -->
  <path
    d="M16.5 4.5C16.5 4.5 22.5 4.5 25.5 7.5C25.5 7.5 22.5 10.5 22.5 10.5L16.5 4.5Z"
    fill="url(#udua-accent)"
    opacity="0.9"
  />

  <!-- Inventory Sync Node -->
  <circle cx="23.5" cy="7.5" r="2.25" fill="#38bdf8" />
</svg>
